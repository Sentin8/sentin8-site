# ci.yml — site lane caller (Sentin8/sentin8-ci site.yml @ci-v1).
# Push to main → harvest + build + deploy to GitHub Pages (sentin8.dev).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly harvest refresh: rebuild so sibling-repo doc changes land on the
    # site without a site-repo commit (harvest pulls public main branches).
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  ci:
    uses: Sentin8/sentin8-ci/.github/workflows/site.yml@ci-v1
    with:
      site-dir: .
      deploy: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write